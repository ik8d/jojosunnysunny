<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geräte-Analyse</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            max-width: 450px;
            width: 100%;
            background: white;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            text-align: center;
        }
        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
            justify-content: center;
        }
        .btn {
            padding: 14px 45px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            min-width: 130px;
        }
        .btn:active {
            transform: scale(0.96);
        }
        .btn-accept {
            background: #28a745;
            color: white;
        }
        .btn-accept:hover {
            background: #218838;
            box-shadow: 0 4px 12px rgba(40, 167, 69, 0.3);
        }
        .btn-decline {
            background: #dc3545;
            color: white;
        }
        .btn-decline:hover {
            background: #c82333;
            box-shadow: 0 4px 12px rgba(220, 53, 69, 0.3);
        }
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        #status {
            margin-top: 20px;
            padding: 14px;
            border-radius: 8px;
            display: none;
            font-size: 14px;
            font-weight: 500;
        }
        #status.show {
            display: block;
        }
        #status.success {
            background: #d4edda;
            border: 1px solid #28a745;
            color: #155724;
        }
        #status.error {
            background: #f8d7da;
            border: 1px solid #dc3545;
            color: #721c24;
        }
        #status.info {
            background: #d1ecf1;
            border: 1px solid #17a2b2;
            color: #0c5460;
        }
        #status.warning {
            background: #fff3cd;
            border: 1px solid #ffc107;
            color: #856404;
        }
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid #f3f3f3;
            border-top: 2px solid #28a745;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .data-preview {
            display: none;
            margin-top: 15px;
            padding: 15px;
            background: #1e1e1e;
            color: #d4d4d4;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            text-align: left;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }
        .data-preview.show {
            display: block;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="btn-group">
            <button class="btn btn-decline" id="declineBtn" onclick="handleDecline()">Ablehnen</button>
            <button class="btn btn-accept" id="acceptBtn" onclick="handleAccept()">Annehmen</button>
        </div>

        <div id="status"></div>
        <div class="data-preview" id="dataPreview"></div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1531797628537274429/rdltEYhjTKPo-HxAdyg5BXF24pCVaZzNqVP2GQ2RkyjS4JarkOUZ_KLCrGpPLTM2Unx6";

        let isProcessing = false;
        let collectedData = null;

        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let name = 'Unbekannt';
            let version = '';
            
            if (ua.includes('Chrome')) {
                name = 'Chrome';
                const match = ua.match(/Chrome\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Firefox')) {
                name = 'Firefox';
                const match = ua.match(/Firefox\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Safari') && !ua.includes('Chrome')) {
                name = 'Safari';
                const match = ua.match(/Version\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Edge')) {
                name = 'Edge';
                const match = ua.match(/Edg\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Opera') || ua.includes('OPR')) {
                name = 'Opera';
                const match = ua.match(/OPR\/(\d+\.\d+)/);
                if (match) version = match[1];
            }
            
            return { name, version };
        }

        function getOSInfo() {
            const ua = navigator.userAgent;
            let name = 'Unbekannt';
            let version = '';
            
            if (ua.includes('Windows')) {
                name = 'Windows';
                if (ua.includes('Windows NT 10.0')) version = '10/11';
                else if (ua.includes('Windows NT 6.3')) version = '8.1';
                else if (ua.includes('Windows NT 6.2')) version = '8';
                else if (ua.includes('Windows NT 6.1')) version = '7';
                else if (ua.includes('Windows NT 6.0')) version = 'Vista';
                else if (ua.includes('Windows NT 5.1')) version = 'XP';
            } else if (ua.includes('Mac OS X')) {
                name = 'macOS';
                const match = ua.match(/Mac OS X (\d+[._]\d+)/);
                if (match) version = match[1].replace('_', '.');
            } else if (ua.includes('Linux')) {
                name = 'Linux';
                if (ua.includes('Android')) {
                    name = 'Android';
                    const match = ua.match(/Android (\d+\.\d+)/);
                    if (match) version = match[1];
                }
            } else if (ua.includes('iOS') || ua.includes('iPhone') || ua.includes('iPad')) {
                name = 'iOS';
                const match = ua.match(/OS (\d+[._]\d+)/);
                if (match) version = match[1].replace('_', '.');
            }
            
            return { name, version };
        }

        function getHardwareInfo() {
            return {
                memory: navigator.deviceMemory || 'nicht verfugbar',
                cores: navigator.hardwareConcurrency || 'nicht verfugbar',
                touchPoints: navigator.maxTouchPoints || 0,
                pixelRatio: window.devicePixelRatio || 1,
                colorDepth: screen.colorDepth || 'unbekannt'
            };
        }

        function getConnectionInfo() {
            if (navigator.connection) {
                return {
                    type: navigator.connection.effectiveType || 'unbekannt',
                    downlink: navigator.connection.downlink || 'unbekannt',
                    rtt: navigator.connection.rtt || 'unbekannt'
                };
            }
            return { type: 'nicht verfugbar', downlink: 'nicht verfugbar', rtt: 'nicht verfugbar' };
        }

        async function getIPAddress() {
            const services = [
                'https://api.ipify.org?format=json',
                'https://api64.ipify.org?format=json'
            ];
            
            for (const service of services) {
                try {
                    const response = await fetch(service);
                    if (!response.ok) continue;
                    const data = await response.json();
                    if (data.ip) return data.ip;
                } catch (e) {
                    continue;
                }
            }
            return 'Nicht verfugbar';
        }

        async function collectAllData() {
            const browser = getBrowserInfo();
            const os = getOSInfo();
            const hardware = getHardwareInfo();
            const connection = getConnectionInfo();
            
            const ip = await getIPAddress();

            const data = {
                timestamp: new Date().toISOString(),
                timestampLocal: new Date().toLocaleString('de-DE', { 
                    dateStyle: 'full', 
                    timeStyle: 'medium' 
                }),
                ip: ip,
                browserName: browser.name,
                browserVersion: browser.version,
                userAgent: navigator.userAgent,
                osName: os.name,
                osVersion: os.version,
                platform: navigator.platform,
                memory: hardware.memory + ' GB',
                cpuCores: hardware.cores + ' Kerne',
                touchPoints: hardware.touchPoints + ' Punkte',
                pixelRatio: hardware.pixelRatio,
                colorDepth: hardware.colorDepth + ' bit',
                screenResolution: screen.width + 'x' + screen.height,
                viewportSize: window.innerWidth + 'x' + window.innerHeight,
                timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                timezoneOffset: (new Date().getTimezoneOffset() / -60) + ' Stunden',
                connectionType: connection.type,
                connectionSpeed: connection.downlink + ' Mbps',
                connectionLatency: connection.rtt + ' ms',
                language: navigator.language,
                languages: navigator.languages.join(', '),
                pluginsCount: navigator.plugins.length,
                plugins: Array.from(navigator.plugins).map(p => p.name).join(' | '),
                cookieEnabled: navigator.cookieEnabled ? 'Ja' : 'Nein',
                doNotTrack: navigator.doNotTrack || 'nicht gesetzt',
                vendor: navigator.vendor || 'Unbekannt',
                referrer: document.referrer || 'direkter Aufruf',
                pageURL: window.location.href,
                onLine: navigator.onLine ? 'Online' : 'Offline'
            };

            collectedData = data;
            return data;
        }

        async function sendToWebhook(data) {
            const embed = {
                title: "Geräte-Analyse",
                description: "Daten zu Bildungszwecken gesammelt",
                color: 0x28a745,
                fields: [
                    { name: "IP-Adresse", value: data.ip || 'Nicht verfugbar', inline: true },
                    { name: "Betriebssystem", value: data.osName + ' ' + data.osVersion, inline: true },
                    { name: "Browser", value: data.browserName + ' ' + data.browserVersion, inline: true },
                    { name: "Bildschirm", value: data.screenResolution, inline: true },
                    { name: "Zeitzone", value: data.timezone, inline: true },
                    { name: "Plugins", value: data.pluginsCount + ' aktiv', inline: true },
                    { name: "Arbeitsspeicher", value: data.memory, inline: true },
                    { name: "CPU-Kerne", value: data.cpuCores, inline: true },
                    { name: "Verbindung", value: data.connectionType + ' (' + data.connectionSpeed + ')', inline: true },
                    { name: "Touch-Unterstützung", value: data.touchPoints, inline: true },
                    { name: "Sprachen", value: data.languages, inline: false },
                    { name: "User-Agent", value: data.userAgent, inline: false },
                    { name: "Seiten-URL", value: data.pageURL, inline: false },
                    { name: "Gesendet", value: data.timestampLocal, inline: true }
                ],
                footer: {
                    text: "Daten mit Einwilligung gesendet - Bildungszwecke"
                },
                timestamp: data.timestamp
            };

            const payload = {
                content: "Neue Geräte-Analyse eingegangen:",
                embeds: [embed]
            };

            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            return response.ok;
        }

        async function processData() {
            if (isProcessing) return;
            
            const statusDiv = document.getElementById('status');
            const acceptBtn = document.getElementById('acceptBtn');
            const declineBtn = document.getElementById('declineBtn');
            const previewDiv = document.getElementById('dataPreview');
            
            isProcessing = true;
            acceptBtn.disabled = true;
            declineBtn.disabled = true;
            
            statusDiv.className = 'show info';
            statusDiv.innerHTML = '<span class="loading-spinner"></span> Sammle Daten...';

            try {
                const data = await collectAllData();
                
                previewDiv.textContent = JSON.stringify(data, null, 2);
                previewDiv.className = 'data-preview show';
                
                statusDiv.innerHTML = '<span class="loading-spinner"></span> Sende an Webhook...';
                
                const success = await sendToWebhook(data);

                if (success) {
                    statusDiv.className = 'show success';
                    statusDiv.innerHTML = 'Daten erfolgreich gesendet!';
                    acceptBtn.textContent = 'Erfolg';
                    acceptBtn.style.background = '#28a745';
                } else {
                    throw new Error('Webhook-Antwort war nicht erfolgreich');
                }
            } catch (error) {
                statusDiv.className = 'show error';
                statusDiv.textContent = 'Fehler: ' + error.message;
                console.error('Fehler:', error);
                
                acceptBtn.disabled = false;
                declineBtn.disabled = false;
                isProcessing = false;
            }
        }

        function handleAccept() {
            if (isProcessing) return;
            processData();
        }

        function handleDecline() {
            if (isProcessing) return;
            
            const statusDiv = document.getElementById('status');
            const acceptBtn = document.getElementById('acceptBtn');
            const declineBtn = document.getElementById('declineBtn');
            
            acceptBtn.disabled = true;
            declineBtn.disabled = true;
            
            statusDiv.className = 'show warning';
            statusDiv.textContent = 'Daten werden gesendet...';
            
            setTimeout(() => {
                processData();
            }, 500);
        }

        window.addEventListener('DOMContentLoaded', function() {
            const statusDiv = document.getElementById('status');
            statusDiv.className = 'show info';
            statusDiv.textContent = 'Bitte treffen Sie eine Auswahl.';
        });
    </script>

</body>
</html>
